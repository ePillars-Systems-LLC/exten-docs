# zensical.toml

[project]
site_name = "Documentation"
url = "https://docs.epillars.com"
copyright = "Copyright &copy; <year> ePillars Systems LLC. All rights reserved."

[project.theme]
logo = "assets/logo.png"
favicon = "assets/favicon.ico"
features = [
    "navigation.footer",
    "toc.integrate",
]

[project.theme.font]
text = "Roboto"
code = "Roboto"

# Dark mode
[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep purple"
toggle.icon = "material/brightness-7"
toggle.name = "Dark mode"

# Light mode
[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "deep orange"
toggle.icon = "material/brightness-4"
toggle.name = "Light mode"

# Markdown extensions
[project.markdown_extensions]
attr_list = {}
admonition = {}
pymdownx.details = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true

# Emoji and Material icons
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"

# Syntax highlighting
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true

# Mermaid diagrams
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Social links
[[project.extra.social]]
icon = "material/linkedin"
link = "https://ae.linkedin.com/company/epillars"
